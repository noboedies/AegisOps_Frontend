<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <header>
    <nav>
      <a href="index">AegisOps</a> &nbsp;
      <a href="signup">signup</a> &nbsp;
      <a href="login">login</a> &nbsp;
    </nav>
  </header>
  <section>
    <div>
      <form th:action="@{/user/register}" method="post">
        <input type="email" name="email" placeholder="Email" required><br><br>
        <input type="text" name="username" placeholder="Username" required><br><br>
        <input type="text" name="name" placeholder="Full name ex: John Doe" required><br><br>
        <input type="text" name="phone" placeholder="Phone ex: 91XXXXXXXX" required><br><br>
        <input type="file" name="profilePic" accept="image/*"><br><br>
        <input type="password" name="password" placeholder="Password" required><br><br>
        <input type="text" name="organization" placeholder="Organization" required><br><br>
        <button type="submit">Sign Up</button>
      </form>
    </div>
  </section>
</body>
</html>
