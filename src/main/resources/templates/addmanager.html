<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <header>
    <nav>
      <a href="/">AegisOps</a> &nbsp;
      <a href="/user/user-dahsboard">Home</a> &nbsp;
      <a href="logout">logout</a> &nbsp;
      <span th:if="${session.user != null}" th:text="${session.user.name}"></span>
    </nav>
  </header>
  <section>
    <hr>
    <h2>Add Manager</h2>
      <span th:if="${error}" th:text="${error}"></span><br><br>
      <span th:if="${success}" th:text="${success}"></span>
    <hr>
    <form action="user/addpm" method="post">
      <input type="text" name="name" placeholder="Enter Manager Name" required><br><br>
      <input type="text" name="username" placeholder="Enter Manager Username" required><br><br>
      <input type="email" name="email" placeholder="Enter Manager Email" required><br><br>
      <input type="email" th:value="${session.user.email}" name="userEmail" placeholder="Enter Manager Email" required readonly><br><br>
      <input type="tel" name="phone" placeholder="Enter Manager Phone" required><br><br>
      <input type="text" name="empId" placeholder="Enter Manager Employee ID" required><br><br>
      <input type="password" name="password" placeholder="Enter Manager Password" required><br><br>
      <button type="submit">Add Manager</button>
    </form>
  </section>
</body>
</html>
